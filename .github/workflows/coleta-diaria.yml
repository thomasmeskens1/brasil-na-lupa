# Coleta diária das fontes oficiais (diretriz 13): Câmara dos Deputados, Senado Federal e STJ.
# Roda às 08:37 de Brasília (11:37 UTC; o Senado pede para evitar horários redondos).
# Só faz commit quando algum dado mudou; o push dispara a publicação na Vercel.
name: Coleta diária

on:
  schedule:
    - cron: "37 11 * * *"
  workflow_dispatch:
    inputs:
      completo:
        description: "Refazer todo o período (reconciliação)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: coleta-diaria
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Câmara dos Deputados
        run: node scripts/coleta/camara/coletar.mjs ${{ inputs.completo && '--completo' || '' }}
      - name: Senado Federal
        run: node scripts/coleta/senado/coletar.mjs ${{ inputs.completo && '--completo' || '' }}
      - name: Senado Federal (registro nas votações e CEAPS)
        run: |
          node scripts/coleta/senado/presenca.mjs
          node scripts/coleta/senado/despesas.mjs ${{ inputs.completo && '--forcar' || '' }}
      - name: Agenda e pauta do Plenário (depois de Câmara e Senado)
        run: node scripts/coleta/agenda/coletar.mjs
      - name: Executivo federal
        run: node scripts/coleta/executivo/coletar.mjs ${{ inputs.completo && '--completo' || '' }}
      # O portal de dados abertos do STJ é lento: reaproveita os arquivos já baixados entre execuções.
      - uses: actions/cache@v4
        with:
          path: scripts/coleta/stj/.cache
          key: stj-${{ github.run_id }}
          restore-keys: stj-
      - name: Superior Tribunal de Justiça
        run: node scripts/coleta/stj/coletar.mjs ${{ inputs.completo && '--completo' || '' }}
      - name: Supremo Tribunal Federal
        run: node scripts/coleta/stf/coletar.mjs ${{ inputs.completo && '--completo' || '' }}
      # Votos nominais do plenário da ALESP só existem em PDF: leitura por coordenadas (pdfplumber).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preparar leitor de PDF da ALESP
        run: |
          python -m venv scripts/coleta/alesp/.venv
          scripts/coleta/alesp/.venv/bin/pip install --quiet -r scripts/coleta/alesp/requirements.txt
          node scripts/coleta/alesp/teste-referencia.mjs
      - name: Assembleia Legislativa e governo de SP
        run: node scripts/coleta/alesp/coletar.mjs ${{ inputs.completo && '--completo' || '' }}
      - name: Tribunal de Contas da União
        run: node scripts/coleta/tribunais-contas/tcu/coletar.mjs
      - name: Tribunal de Contas do Estado de São Paulo
        env:
          TCESP_PYTHON: scripts/coleta/alesp/.venv/bin/python
        run: node scripts/coleta/tribunais-contas/tce-sp/coletar.mjs ${{ inputs.completo && '--completo' || '' }}
      - name: Preparar leitor de PDF de Atibaia
        run: python -m pip install --quiet --user pdfplumber==0.11.10
      - name: Atibaia (Imprensa Oficial, Câmara e finanças pelo TCE-SP)
        run: node scripts/coleta/atibaia/coletar.mjs ${{ inputs.completo && '--completo' || '' }}
      - name: Eleitos (TSE)
        run: node scripts/coleta/eleitos/coletar.mjs
      # Títulos em linguagem simples: rodam depois de todos os coletores; o cache evita refazer ~25 min de consultas às agências.
      - uses: actions/cache@v4
        with:
          path: scripts/coleta/titulos/.cache
          key: titulos-${{ github.run_id }}
          restore-keys: titulos-
      - name: Títulos em linguagem simples (com verificador)
        run: |
          node scripts/coleta/titulos/gerar.mjs
          node scripts/coleta/titulos/verificar.mjs
      - name: Registrar mudanças
        run: |
          git config user.name "coleta-diaria"
          git config user.email "coleta-diaria@users.noreply.github.com"
          git add dados/camara dados/senado dados/agenda dados/stj dados/stf dados/executivo dados/alesp dados/governo-sp dados/atibaia dados/tribunais-contas dados/eleitos dados/titulos
          # meta.json muda a cada execução; só publica se algum dado de fato mudou.
          if git diff --cached --name-only | grep -qv '/meta\.json$'; then
            git commit -m "Coleta diária: dados oficiais ($(date -u +%F))"
            git push
          else
            echo "Nenhum dado novo."
          fi
