# Coleta diária das fontes oficiais (diretriz 13): Câmara dos Deputados, Senado Federal e STJ.
# Roda às 08:37 de Brasília (11:37 UTC; o Senado pede para evitar horários redondos).
# Só faz commit quando algum dado mudou; o push dispara a publicação na Vercel.
name: Coleta diária

on:
  schedule:
    - cron: "37 11 * * *"
  workflow_dispatch:
    inputs:
      completo:
        description: "Refazer todo o período (reconciliação)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: coleta-diaria
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    # Cada etapa lenta tem limite próprio (timeout-minutes): se estourar, as outras seguem e o registro roda.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Câmara dos Deputados
        continue-on-error: true
        run: node scripts/coleta/camara/coletar.mjs ${{ inputs.completo && '--completo' || '' }}
      - name: Senado Federal
        continue-on-error: true
        run: node scripts/coleta/senado/coletar.mjs ${{ inputs.completo && '--completo' || '' }}
      - name: Senado Federal (registro nas votações e CEAPS)
        continue-on-error: true
        run: |
          node scripts/coleta/senado/presenca.mjs
          node scripts/coleta/senado/despesas.mjs ${{ inputs.completo && '--forcar' || '' }}
      - name: Autoria transformada em norma (Câmara e Senado)
        continue-on-error: true
        run: node scripts/coleta/autoria/coletar.mjs ${{ inputs.completo && '--completo' || '' }}
      - name: Consultas públicas do Senado e enquetes da Câmara (canais oficiais)
        continue-on-error: true
        run: node scripts/coleta/participacao/coletar.mjs --prazo-min 20
      - name: Agenda e pauta do Plenário (depois de Câmara e Senado)
        continue-on-error: true
        run: node scripts/coleta/agenda/coletar.mjs
      - name: Executivo federal
        continue-on-error: true
        run: node scripts/coleta/executivo/coletar.mjs ${{ inputs.completo && '--completo' || '' }}
      # O portal de dados abertos do STJ é lento: reaproveita os arquivos já baixados entre execuções.
      - uses: actions/cache@v4
        with:
          path: scripts/coleta/stj/.cache
          key: stj-${{ github.run_id }}
          restore-keys: stj-
      - name: Superior Tribunal de Justiça
        continue-on-error: true
        run: node scripts/coleta/stj/coletar.mjs ${{ inputs.completo && '--completo' || '' }}
      - name: Supremo Tribunal Federal
        continue-on-error: true
        run: node scripts/coleta/stf/coletar.mjs ${{ inputs.completo && '--completo' || '' }}
      # Votos nominais do plenário da ALESP só existem em PDF: leitura por coordenadas (pdfplumber).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preparar leitor de PDF da ALESP
        run: |
          python -m venv scripts/coleta/alesp/.venv
          scripts/coleta/alesp/.venv/bin/pip install --quiet -r scripts/coleta/alesp/requirements.txt
          node scripts/coleta/alesp/teste-referencia.mjs
      - name: Assembleia Legislativa e governo de SP
        continue-on-error: true
        run: node scripts/coleta/alesp/coletar.mjs ${{ inputs.completo && '--completo' || '' }}
      # Fotos oficiais só das fontes que declaram permissão de uso (Câmara, Senado e ALESP; ver
      # docs/pesquisa/fotos-licencas.md). Depois das listas oficiais; sharp só para reduzir a 256 px.
      - name: Fotos oficiais de parlamentares (Câmara, Senado e ALESP)
        continue-on-error: true
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund --prefix scripts/coleta/fotos sharp@0.35.5
          node scripts/coleta/fotos/coletar.mjs
      - name: Tribunal de Contas da União
        continue-on-error: true
        run: node scripts/coleta/tribunais-contas/tcu/coletar.mjs
      - name: Tribunal de Contas do Estado de São Paulo
        continue-on-error: true
        env:
          TCESP_PYTHON: scripts/coleta/alesp/.venv/bin/python
        run: node scripts/coleta/tribunais-contas/tce-sp/coletar.mjs ${{ inputs.completo && '--completo' || '' }}
      # Demais tribunais de contas: um passo por tribunal, cada um com limite de tempo próprio.
      - name: Tribunal de Contas do Estado do Rio de Janeiro
        continue-on-error: true
        timeout-minutes: 15
        env:
          COLETA_ORCAMENTO_MIN: "10"
        run: node scripts/coleta/tribunais-contas/tce-rj/coletar.mjs
      - name: Tribunal de Contas do Estado do Amazonas
        continue-on-error: true
        timeout-minutes: 20
        env:
          COLETA_ORCAMENTO_MIN: "15"
        run: node scripts/coleta/tribunais-contas/tce-am/coletar.mjs ${{ inputs.completo && '--completo' || '' }}
      - name: Tribunal de Contas do Estado de Pernambuco
        continue-on-error: true
        timeout-minutes: 20
        env:
          COLETA_ORCAMENTO_MIN: "15"
        run: |
          node scripts/coleta/tribunais-contas/tce-pe/testes.mjs
          node scripts/coleta/tribunais-contas/tce-pe/coletar.mjs ${{ inputs.completo && '--completo' || '' }}
      - name: Tribunal de Contas do Estado do Paraná
        continue-on-error: true
        timeout-minutes: 20
        # Lê a deliberação dos PDFs com o pdfplumber do ambiente da ALESP (preparado acima).
        env:
          COLETA_ORCAMENTO_MIN: "15"
          TCEPR_PYTHON: scripts/coleta/alesp/.venv/bin/python
        run: |
          node scripts/coleta/tribunais-contas/tce-pr/testes.mjs
          node scripts/coleta/tribunais-contas/tce-pr/coletar.mjs
      - name: Tribunal de Contas do Estado de Roraima
        continue-on-error: true
        timeout-minutes: 20
        env:
          COLETA_ORCAMENTO_MIN: "15"
        run: |
          node scripts/coleta/tribunais-contas/tce-rr/testes.mjs
          node scripts/coleta/tribunais-contas/tce-rr/coletar.mjs ${{ inputs.completo && '--completo' || '' }}
      - name: Tribunal de Contas do Estado do Rio Grande do Sul
        continue-on-error: true
        timeout-minutes: 20
        env:
          COLETA_ORCAMENTO_MIN: "15"
        run: |
          node scripts/coleta/tribunais-contas/tce-rs/testes.mjs
          node scripts/coleta/tribunais-contas/tce-rs/coletar.mjs ${{ inputs.completo && '--completo' || '' }}
      - name: Tribunal de Contas do Distrito Federal
        continue-on-error: true
        timeout-minutes: 25
        # Lê a ata da Sessão Especial nos PDFs dos relatórios com o pdftotext (poppler-utils).
        env:
          COLETA_ORCAMENTO_MIN: "20"
        run: |
          command -v pdftotext >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)
          node scripts/coleta/tribunais-contas/tc-df/testes.mjs
          node scripts/coleta/tribunais-contas/tc-df/coletar.mjs
      - name: Tribunal de Contas dos Municípios do Pará
        continue-on-error: true
        timeout-minutes: 20
        # Lê o texto das edições do Diário Oficial Eletrônico com o pypdfium2 (vem com o pdfplumber da ALESP).
        env:
          COLETA_ORCAMENTO_MIN: "15"
          TCMPA_PYTHON: scripts/coleta/alesp/.venv/bin/python
        run: |
          node scripts/coleta/tribunais-contas/tcm-pa/testes.mjs
          node scripts/coleta/tribunais-contas/tcm-pa/coletar.mjs ${{ inputs.completo && '--completo' || '' }}
      - name: Preparar leitor de PDF de Atibaia
        run: python -m pip install --quiet --user pdfplumber==0.11.10
      - name: Atibaia (Imprensa Oficial, Câmara e finanças pelo TCE-SP)
        continue-on-error: true
        run: node scripts/coleta/atibaia/coletar.mjs ${{ inputs.completo && '--completo' || '' }}
      - name: Eleitos (TSE)
        continue-on-error: true
        run: node scripts/coleta/eleitos/coletar.mjs
      - name: Patrimônio declarado ao TSE (parlamentares federais)
        continue-on-error: true
        run: node scripts/coleta/patrimonio/coletar.mjs
      # Títulos em linguagem simples: rodam depois de todos os coletores; o cache evita refazer ~25 min de consultas às agências.
      - uses: actions/cache@v4
        with:
          path: scripts/coleta/titulos/.cache
          key: titulos-${{ github.run_id }}
          restore-keys: titulos-
      - name: Títulos em linguagem simples (com verificador)
        continue-on-error: true
        # Grava só no fim (arquivo temporário) e guarda cache por consulta: interrompido, retoma no dia seguinte.
        timeout-minutes: 60
        run: |
          node scripts/coleta/titulos/gerar.mjs
          node scripts/coleta/titulos/verificar.mjs
      - name: Assembleias de Sergipe e da Bahia (SPL Ágape)
        continue-on-error: true
        env:
          COLETA_ORCAMENTO_MIN: "20"
        run: |
          node scripts/coleta/estados/agape/testes.mjs
          node scripts/coleta/estados/agape/coletar.mjs
      - name: Assembleias do Rio Grande do Norte e do Espírito Santo
        continue-on-error: true
        timeout-minutes: 25
        # O ES lê os boletins em PDF com o pdfplumber do ambiente da ALESP (preparado acima).
        env:
          COLETA_ORCAMENTO_MIN: "20"
        run: |
          node scripts/coleta/estados/rn/testes.mjs
          node scripts/coleta/estados/es/testes.mjs
          node scripts/coleta/estados/rn/coletar.mjs
          node scripts/coleta/estados/es/coletar.mjs
      - name: Assembleias de Pernambuco e do Distrito Federal (dados abertos)
        continue-on-error: true
        run: |
          node scripts/coleta/estados/abertos/testes.mjs
          node scripts/coleta/estados/abertos/coletar.mjs
      - name: Assembleia do Maranhão (API pública do ALEMALEGIS)
        continue-on-error: true
        env:
          COLETA_ORCAMENTO_MIN: "10"
        run: |
          node scripts/coleta/estados/ma/testes.mjs
          node scripts/coleta/estados/ma/coletar.mjs
      - name: Governo de Goiás (leis, decretos e vetos da Casa Civil; a Assembleia não é acessada)
        continue-on-error: true
        env:
          COLETA_ORCAMENTO_MIN: "15"
        run: |
          node scripts/coleta/estados/go/testes.mjs
          node scripts/coleta/estados/go/coletar.mjs
      - name: Assembleia do Paraná (API pública de dados abertos da ALEP)
        continue-on-error: true
        run: |
          node scripts/coleta/estados/pr/testes.mjs
          node scripts/coleta/estados/pr/coletar.mjs
      - name: Assembleia do Pará (portal da ALEPA e API do Banco de Leis)
        continue-on-error: true
        timeout-minutes: 20
        env:
          COLETA_ORCAMENTO_MIN: "15"
        run: |
          node scripts/coleta/estados/pa/testes.mjs
          node scripts/coleta/estados/pa/coletar.mjs
      - name: Assembleia de Santa Catarina (portal da ALESC, e-Legis e Legislação SC)
        continue-on-error: true
        timeout-minutes: 20
        env:
          COLETA_ORCAMENTO_MIN: "15"
        run: |
          node scripts/coleta/estados/sc/testes.mjs
          node scripts/coleta/estados/sc/coletar.mjs
      - name: Assembleia do Amapá (eLegis e portal da ALAP)
        continue-on-error: true
        timeout-minutes: 20
        env:
          COLETA_ORCAMENTO_MIN: "15"
        run: |
          node scripts/coleta/estados/ap/testes.mjs
          node scripts/coleta/estados/ap/coletar.mjs
      - name: Assembleia do Ceará (portal e proposições da ALECE, votações nominais em PDF e Diário Oficial)
        continue-on-error: true
        timeout-minutes: 20
        env:
          COLETA_ORCAMENTO_MIN: "15"
          CE_PYTHON: scripts/coleta/estados/ce/.venv/bin/python
        run: |
          python -m venv scripts/coleta/estados/ce/.venv
          scripts/coleta/estados/ce/.venv/bin/pip install --quiet -r scripts/coleta/estados/ce/requirements.txt
          node scripts/coleta/estados/ce/testes.mjs
          node scripts/coleta/estados/ce/coletar.mjs
      - name: Registrar mudanças
        run: |
          git config user.name "coleta-diaria"
          git config user.email "coleta-diaria@users.noreply.github.com"
          git add dados/camara dados/senado dados/agenda dados/stj dados/stf dados/executivo dados/alesp dados/governo-sp dados/atibaia dados/tribunais-contas dados/eleitos dados/titulos dados/estados/se dados/estados/ba dados/estados/rn dados/estados/es dados/estados/pe dados/estados/df dados/estados/ma dados/participacao dados/autoria dados/patrimonio dados/fotos dados/estados/go dados/estados/pr dados/estados/pa dados/estados/sc dados/estados/ce dados/estados/ap
          # meta.json muda a cada execução; só publica se algum dado de fato mudou.
          if git diff --cached --name-only | grep -qv '/meta\.json$'; then
            git commit -m "Coleta diária: dados oficiais ($(date -u +%F))"
            git pull --rebase
            git push
          else
            echo "Nenhum dado novo."
          fi
